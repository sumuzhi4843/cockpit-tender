server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # —— 登录验证端点（2026-08-09 方案 C）——
    # 带正确 Basic Auth 凭据访问 → try_files 找到 verify.json → 200
    # 凭据错误 / 缺失 → nginx auth_basic 返回 401（前端 JS 捕获）
    location = /auth/verify {
        auth_basic "Cockpit Login";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /auth/verify.json =401;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # JS/CSS/JSON no-cache
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # HTML no-cache
    location ~ \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
