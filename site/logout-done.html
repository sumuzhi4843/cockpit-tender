<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>已安全退出 · 盐城政企数据驾驶舱</title>
  <meta http-equiv="refresh" content="2;url=/login.html" />
  <style>
    :root { --primary: #00467f; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f2f7fc 0%, #e8f0f9 100%);
      color: #1f2d3d;
    }
    .box {
      text-align: center;
      background: #fff;
      padding: 44px 52px;
      border-radius: 14px;
      box-shadow: 0 6px 30px rgba(0, 70, 127, 0.10);
      max-width: 92vw;
    }
    .icon {
      width: 56px; height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #e6f4ea;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    h1 { font-size: 21px; color: var(--primary); margin-bottom: 12px; }
    p { font-size: 13.5px; color: #5b6475; line-height: 1.9; }
    .tip { margin-top: 10px; color: #8a93a3; font-size: 12.5px; }
    a.btn {
      display: inline-block;
      margin-top: 22px;
      padding: 9px 34px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }
    a.btn:hover { background: #005a9e; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>已安全退出登录</h1>
    <p>您的登录凭据已清除，下次访问驾驶舱需重新登录。</p>
    <p class="tip">如浏览器再次弹出账号密码输入框，请点击「取消」即可。</p>
    <a class="btn" href="/login.html">前往登录页</a>
    <p class="tip">2 秒后自动跳转…</p>
  </div>
</body>
</html>
