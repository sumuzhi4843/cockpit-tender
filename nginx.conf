server {
    listen       80;
    server_name  localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript text/plain;
    # 2026-09-07 加载优化：优先发预压缩 .gz 文件（部署时 gzip -9 预生成），
    # 避免每次请求实时 gzip 131MB 的 tender.json（实测 3.6s CPU/次）
    gzip_static on;

    location = /auth/verify {
        auth_basic "Tender Login";
        auth_basic_user_file /etc/nginx/.htpasswd;
        error_page 401 = @authfail;
        try_files /auth/verify.json =401;
    }
    location = /logout {
        error_page 401 /logout-done.html;
        return 401;
    }
    location = /logout-done.html {
        add_header WWW-Authenticate 'Basic realm="Tender Logout"' always;
        add_header Cache-Control "no-store" always;
    }

    # 招投标区县修订 + 收藏 API
    location /api/tender/ {
        auth_basic "Tender Login";
        auth_basic_user_file /etc/nginx/.htpasswd;
        error_page 401 = @authfail;
        proxy_pass http://172.18.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 2026-09-21 手机端弹原生密码框修复：auth_basic 产生的 401 自带
    # WWW-Authenticate 挑战头，手机浏览器（华为 ArkWeb 等）收到即弹原生账号密码框，
    # 旧凭据会话（如改密后的手机）反复被打扰。统一转 403 JSON（无挑战头→不弹窗），
    # 前端 Auth.handleAuthFail 收到 401/403 即清会话回登录页重新认证。
    # 注：/logout 的 401 挑战是登出机制本体（清浏览器缓存凭据），不在此列，保留。
    location @authfail {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"ok":false,"error":"auth_failed","relogin":1}';
    }

    location / { try_files $uri $uri/ =404; }
    location ~* \.(js|css|json)$ {
        # 2026-09-07 加载优化：no-store → no-cache（协商缓存）
        # no-store 禁止存副本导致每次全量重拉 tender.json（gzip 9.8MB）；
        # no-cache 保留每次协商：文件没变 304 只传 header（秒开），
        # 主抓后 ETag/Last-Modified 变化自动拉新，不会拿到旧数据。
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location ~ \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
